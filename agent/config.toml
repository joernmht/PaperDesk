# PaperDesk agent model config.
# EU-ONLY (Joern 2026-11-09): only Europe-hosted LLMs may see chat content. agentd.py refuses to start unless
# base_url's host is on its EU_ENDPOINTS allowlist (code, on purpose) AND region = "EU" here.
# NOT allowed: OpenRouter (US company in the request path, even for EU-hosted models), US/CN model APIs.
# ScaDS.AI = TU Dresden / Uni Leipzig, Germany; free, shared daily cap ~1500 req (the paper studies use it too).
[model]
# DeepSeek did the full code -> test -> PR flow on 2026-11-09; gpt-oss and GLM-5.3-Flash stalled on it
name = "deepseek-ai/DeepSeek-V4.1-Flash"
base_url = "https://llm.scads.ai/v1"
api_key_env = "SCADS_API_KEY"
region = "EU"
temperature = 0.3
timeout = 120
choices = ["deepseek-ai/DeepSeek-V4.1-Flash", "openai/gpt-oss-120b", "zai-org/GLM-5.3-Flash", "mistralai/Mistral-Large-4"]

[approvals]
# auto = PRs, comments, issues and writable clones run without asking (Joern 2026-11-09: "the default can be
# Approve"); ask = they wait for approve/reject. A chat can override it (POST/PATCH thread `approvals`).
default = "auto"

[github]
# writes (comment, issue, writable clone + PR) only for these owners
write_owners = ["joernmht"]
# repos the agent must not read or touch (empty: EBL is fine on EU-hosted models, Joern 2026-11-09)
deny = []
author_name = "Joern Maurischat"
author_email = "joern.maurischat@tu-dresden.de"
